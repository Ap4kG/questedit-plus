plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.ap4k'
version = project.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    // Only needed at compile time; the real jars live in the instance's mods folder.
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:${project.ftb_quests_version}"
    compileOnly "dev.architectury:architectury-neoforge:13.0.11"
}

jar {
    manifest {
        attributes([
                'Implementation-Version': project.version,
                'License': 'MIT'
        ])
    }
}
