[[mods]]
modId="questeditplus"
version="${file.jarVersion}"
displayName="Quest Editor Plus"
authors="Ap4k"
description='''
Editing QoL for the FTB Quests quest book (client-side):
- Alt + LMB drag: create/remove dependencies (works with multi-selection)
- Ctrl + mouse wheel: resize quests / chapter images
- Alt + mouse wheel: cycle quest shapes
- Middle-click move: quests follow the cursor with live dependency lines
- Magnetic alignment guides while moving
- Arrow keys: nudge selection (Shift for fine steps)
- Alt + LMB click: open the edit menu
'''

